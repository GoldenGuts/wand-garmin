# Example: pick the Wand spot automatically from the watch's Bluetooth signal strength.
#
# Idea: one BLE scanner (an ESPHome device with `esp32_ble_tracker`, for example) sits between
# two places you use the watch from, and reports the watch's RSSI as a sensor. One scanner gives
# distance only: a strong signal means you are close (bed), a weak signal means you are further
# away (desk). The two thresholds below are two occupancy sensors; the gap between them is
# hysteresis, so when neither is on the watch keeps its current spot.
#
# Setup: create the RSSI sensor, rename `sensor.<your_ble_scanner>_watch_rssi` below, then on the
# watch link each spot to its sensor (Spot -> Presence sensor). Tune the thresholds from the
# history of the RSSI sensor while standing at each spot.

input_number:
  wand_near_rssi:
    name: "Wand · near spot RSSI (stronger than)"
    min: -100
    max: -30
    step: 1
    initial: -62
    unit_of_measurement: dBm
    icon: mdi:bed
  wand_far_rssi:
    name: "Wand · far spot RSSI (weaker than)"
    min: -100
    max: -30
    step: 1
    initial: -72
    unit_of_measurement: dBm
    icon: mdi:desk

template:
  - binary_sensor:
      - name: "Spot Near"
        unique_id: wand_spot_near
        device_class: occupancy
        icon: mdi:bed
        state: >-
          {% set r = states('sensor.<your_ble_scanner>_watch_rssi') | float(none) %}
          {{ r is not none and r > states('input_number.wand_near_rssi') | float(-62) }}
      - name: "Spot Far"
        unique_id: wand_spot_far
        device_class: occupancy
        icon: mdi:desk
        state: >-
          {% set r = states('sensor.<your_ble_scanner>_watch_rssi') | float(none) %}
          {{ r is not none and r < states('input_number.wand_far_rssi') | float(-72) }}
